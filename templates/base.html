<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgriLens Rwanda | National Agricultural Analytics{% endblock %}</title>
    
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet Mapping Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    
    <!-- Alpine.js Core (Milestone 4 Interactive Navigation) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

    <style>[x-cloak] { display: none !important; }</style>
    <!-- Stylesheets with Cache Buster -->
    <link rel="stylesheet" href="/static/css/main.css?v=20261003_v6">
    {% block extra_css %}{% endblock %}
</head>
<body class="agrilens-body">
    <div class="app-layout" 
         x-data="{ sidebarOpen: false, sidebarCollapsed: localStorage.getItem('agrilens_sidebar_collapsed') === 'true', paletteOpen: false }"
         @keydown.window.prevent.cmd.k="paletteOpen = true"
         @keydown.window.prevent.ctrl.k="paletteOpen = true">
        {% include "includes/sidebar.html" %}
        <div class="main-content-wrapper">
            {% include "includes/navbar.html" %}
            <main class="page-content">
                {% block content %}{% endblock %}
            </main>
            {% include "includes/footer.html" %}
        </div>
        {% include "includes/command_palette.html" %}
    </div>
    
    <!-- Core & Dashboard JavaScript with Cache Buster -->
    <script src="/static/js/main.js?v=20261003_v6"></script>
    <script src="/static/js/dashboard.js?v=20261003_v6"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
